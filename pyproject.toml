[project]
name = "jaxbessel"
version = "0.1.0"
description = "Differentiable Bessel functions of the first kind in JAX."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Benjamin Pope", email = "benjamin.pope@mq.edu.au"},
  {name = "Shashank Dholakia", email = "s.dholakia@uq.edu.au"},
]
keywords = ["jax", "bessel", "special functions", "autodiff", "differentiable"]
urls = {repository = "https://github.com/benjaminpope/jaxbessel"}
dependencies = ["jax>=0.4.30", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest", "scipy"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
