[project]
name = "jaxbessel"
version = "0.2.0"
description = "Differentiable Bessel functions of the first kind in JAX: J_n, spherical j_n and J_nu(x)/x^nu for real order."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Benjamin Pope", email = "benjamin.pope@mq.edu.au"},
  {name = "Shashank Dholakia", email = "s.dholakia@uq.edu.au"},
]
keywords = ["jax", "bessel", "spherical bessel", "special functions", "autodiff", "differentiable"]
urls = {repository = "https://github.com/benjaminpope/jaxbessel"}
dependencies = ["jax>=0.4.30", "numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest", "scipy"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
